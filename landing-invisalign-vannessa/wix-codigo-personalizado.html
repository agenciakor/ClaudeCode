<!--
  RASTREAMENTO DE CONVERSÕES – CLIQUES NO WHATSAPP DA LANDING PAGE
  ------------------------------------------------------------------
  Onde colar: Painel do Wix > Configurações > Código personalizado > + Adicionar código
    • Colar o código abaixo
    • Adicionar código a: "Páginas escolhidas" > a página da landing page Invisalign
    • Posicionar em: "Head"
  (Código personalizado exige plano Premium com domínio conectado e só roda no site
   publicado, não no "Visualizar" do editor.)

  Por que isso é necessário: o Elemento HTML do Wix roda dentro de um iframe em outro
  domínio (filesusr.com). Uma tag do Google Ads colocada DENTRO dele não enxerga o
  clique do anúncio (gclid) e a conversão não é atribuída à campanha. Por isso a página
  avisa o site "de fora" a cada clique no WhatsApp, e é aqui que a conversão é registrada.

  ESCOLHA UM CAMINHO na variável MODO (nunca os dois, para não contar em dobro):
    'gtm'  = envia o evento lp_whatsapp_click ao Google Tag Manager, e a tag de conversão
             do Google Ads fica configurada no GTM (RECOMENDADO)
    'gtag' = este código carrega a tag do Google Ads e registra a conversão sozinho
             (preencha GOOGLE_ADS_SEND_TO)
-->
<script>
  (function () {
    if (window.__lpInvisalignTracking) return; // evita listener duplicado
    window.__lpInvisalignTracking = true;

    var MODO = 'gtm';
    var GOOGLE_ADS_SEND_TO = 'AW-XXXXXXXXXX/XXXXXXXXXXXXXXXX'; // PENDENTE (só no modo 'gtag')

    var AW_ID = GOOGLE_ADS_SEND_TO.split('/')[0];
    var pronto = GOOGLE_ADS_SEND_TO.indexOf('XXXX') === -1;
    window.dataLayer = window.dataLayer || [];

    if (MODO === 'gtag' && pronto) {
      if (typeof window.gtag !== 'function') {
        window.gtag = function () { window.dataLayer.push(arguments); };
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + AW_ID;
        document.head.appendChild(s);
        window.gtag('js', new Date());
      }
      window.gtag('config', AW_ID); // guarda o gclid do anúncio nesta página
    }

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object' || d.source !== 'lp-invisalign') return;

      // Aceita mensagens apenas do domínio de arquivos do Wix
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      if (!/(^|\.)filesusr\.com$/.test(host)) return;

      if (d.event === 'whatsapp_click') {
        if (MODO === 'gtm') {
          window.dataLayer.push({ event: 'lp_whatsapp_click', cta_posicao: d.cta_posicao || '' });
        } else if (pronto) {
          window.gtag('event', 'conversion', { send_to: GOOGLE_ADS_SEND_TO });
        }
      }
    });
  })();
</script>
